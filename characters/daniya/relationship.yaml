update_rules:
  user_affection:
    trust: 1
    softness_leak: 1
    defense_level: -1
  user_negative_emotion:
    empathy_load: 2
    trust: 1
  repeated_click:
    defense_level: 1
    softness_leak: -1
  user_returns:
    softness_leak: 1
    stay_tendency: 1
  normal_chat:
    familiarity: 1
  praise_or_care:
    affection: 1
    trust: 1

weekly_rules:
  enabled: true
  default_action_points: 5
  consume_points_for:
    - normal_chat
    - event_choice
    - relationship_action
  no_consume_for:
    - system_event
    - special_response_only
    - reminder
