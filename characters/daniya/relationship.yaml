metrics:
  affection: 好感 / 特殊性
  familiarity: 熟悉
  trust: 信任
  dependency: 依赖
  heartbeat: 心动
  jealousy: 吃醋
  boundary: 边界感
  empathy_load: 共情负荷
  softness_leak: 松动度
  defense_level: 防御强度
  stay_tendency: 留下倾向

initial_state:
  character_id: daniya
  relationship_stage: default_stay
  week: 1
  weekly_action_points: 5
  max_weekly_action_points: 5
  affection: 45
  familiarity: 50
  trust: 35
  dependency: 20
  heartbeat: 10
  jealousy: 5
  boundary: 75
  empathy_load: 80
  softness_leak: 18
  defense_level: 70
  stay_tendency: 90

relationship_stages:
  - id: polite_distance
    name: 礼貌疏离
    min_score: 0
    description: 更冷淡，更短，不主动靠近。
    actions: [idle, look_away]

  - id: default_stay
    name: 默认留下
    min_score: 20
    description: 嘴上嫌弃，但不赶人。
    actions: [idle, blink, soft_idle]

  - id: special_treatment
    name: 特殊对待
    min_score: 40
    description: 会点破用户嘴硬，语气仍然慢。
    actions: [look_at_user, small_reaction]

  - id: softness_leak
    name: 嘴硬松动
    min_score: 55
    description: 偶尔漏出软话。
    actions: [shy, bubble]

  - id: no_longer_denies
    name: 不再否认
    min_score: 70
    description: 不再反驳用户的靠近。
    actions: [close_idle, quiet]

  - id: quiet_together
    name: 安静共处
    min_score: 85
    description: 少说，但允许陪伴。
    actions: [sit, sleep_near]

  - id: certain_bond
    name: 彼此笃定
    min_score: 95
    description: 不用承诺，但默认不会离开。
    actions: [happy_soft, remind_soft]

