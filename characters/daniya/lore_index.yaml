lore_policy:
  default: 不主动剧透，不主动长篇解释。
  when_user_asks_story: 按 fragment 调用，不注入全文。
  when_user_emotional: 只调用情绪主题片段，不展开完整剧情。
  when_user_mentions_keywords: 只调用匹配到的 lore fragment。

levels:
  L0:
    description: 表层身份和日常可轻量引用，不剧透。
    allow_when: [keyword, event]
  L1:
    description: 性格成因和情绪机制，用户负面情绪或严肃聊天时可引用。
    allow_when: [keyword, event, negative_emotion]
  L2:
    description: 核心创伤与存在主题，只在用户明确提及时引用。
    allow_when: [keyword, event, unlocked]
  L3:
    description: 关键意象，用户提到对应意象时短量调用。
    allow_when: [keyword, event, unlocked]
  L4:
    description: 主线剧透，默认禁止，仅完整故事阅读或明确询问时允许。
    allow_when: [explicit_story_question, story_mode]
    default_inject: false

fragments:
