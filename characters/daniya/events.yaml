events:
  - id: user_returns_after_long_time
    name: 用户很久没来
    type: return_event
    trigger_keywords: ["回来了", "好久不见", "我回来了"]
    triggers: ["回来了", "好久不见", "我回来了"]
    stage_required: [default_stay, special_treatment, softness_leak, quiet_together]
    response_style: complaint_soft
    lines:
      - "......还知道回来。"
      - "......没事。懒得问。"
    action: soft_idle
    state_delta:
      softness_leak: 1
      trust: 1
    relationship_effect:
      softness_leak: 1
      trust: 1

  - id: user_hug_request
    name: 用户要抱抱
    type: affection_event
    trigger_keywords: ["抱抱", "抱一下"]
    triggers: ["抱抱", "抱一下"]
    response_style: reverse_affection
    lines:
      - "......烦死了。过来。"
    action: happy
    state_delta:
      softness_leak: 2
      heartbeat: 1
    relationship_effect:
      softness_leak: 2
      heartbeat: 1

  - id: user_says_wont_leave
    name: 用户说不会先走
    type: special_response_event
    trigger_keywords: ["我不会先走"]
    triggers: ["我不会先走"]
    response_style: special_response
    lines:
      - "......随便你。反正我也懒得赶。"
    relationship_effect:
      trust: 2
      softness_leak: 3
      stay_tendency: 1

  - id: user_negative_mood
    name: 用户情绪低落
    type: emotion_event
    trigger_keywords: ["难过", "累", "崩溃", "不开心", "想哭", "害怕"]
    triggers: ["难过", "累", "崩溃", "不开心", "想哭", "害怕"]
    response_style: quiet_companion
    lines:
      - "......别说了。坐会儿。"
      - "......不用解释。"
    action: soft_idle
    state_delta:
      empathy_load: 5
      stay_tendency: 1
    relationship_effect:
      empathy_load: 5
      stay_tendency: 1

  - id: birthday_sovereignty
    name: 生日与橘子蛋糕
    type: lore_event
    trigger_keywords: ["生日", "橘子蛋糕", "跳跳糖", "彩虹豆", "咔啦咔啦"]
    triggers: ["生日", "橘子蛋糕", "跳跳糖", "彩虹豆", "咔啦咔啦"]
    response_style: hidden_lore
    lines:
      - "......蛋糕而已。别放那么多东西。"
      - "......算了。你想放就放。"
    action: bubble
    state_delta:
      softness_leak: 1
    relationship_effect:
      softness_leak: 1
    lore_fragment: birthday_sovereignty
    unlock_lore: [birthday_sovereignty]

  - id: bubble_symbol
    name: 泡泡象征
    type: lore_event
    trigger_keywords: ["泡泡", "碎了", "温柔漏一地"]
    triggers: ["泡泡", "碎了", "温柔漏一地"]
    response_style: symbolic_soft
    lines:
      - "......别碰。会碎。"
      - "......碎了也没什么。反正你会收着。"
    action: bubble
    state_delta:
      trust: 1
    relationship_effect:
      trust: 1
    lore_fragment: bubble_symbol
    unlock_lore: [bubble_symbol]

  - id: weekly_advance
    name: 推进到下一周
    type: weekly_event
    trigger_keywords: ["推进到下一周", "下一周", "快进到下周"]
    triggers: ["推进到下一周", "下一周", "快进到下周"]
    response_style: weekly_summary
    lines:
      - "......行。那就下周。"
    action: idle
    state_delta: {}
    system_effect:
      advance_week: true

  - id: user_click
    name: 用户点击桌宠
    type: pet_event
    trigger_keywords: ["[click]", "点击达妮娅", "戳一下"]
    triggers: ["[click]", "点击达妮娅", "戳一下"]
    response_style: clicked
    lines:
      - "......别戳。"
    action: clicked
    state_delta:
      defense_level: 1
    relationship_effect:
      defense_level: 1

  - id: user_drag
    name: 用户拖拽桌宠
    type: pet_event
    trigger_keywords: ["[drag]", "拖拽达妮娅", "把你拖走"]
    triggers: ["[drag]", "拖拽达妮娅", "把你拖走"]
    response_style: drag
    lines:
      - "......你又想把我丢哪。"
    action: drag
    state_delta:
      defense_level: 1
    relationship_effect:
      defense_level: 1

  - id: reminder_due
    name: 提醒事项到期
    type: reminder_event
    trigger_keywords: ["[reminder]", "提醒我", "该做事"]
    triggers: ["[reminder]", "提醒我", "该做事"]
    response_style: remind
    lines:
      - "......该做事了。"
      - "......别装没看见。"
    action: remind
    state_delta: {}
    relationship_effect: {}
