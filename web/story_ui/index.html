/* ─── Liquid Glass ─── */
.liquid-glass {
  background: rgb(255 255 255 / var(--g-alpha));
  background-blend-mode: luminosity;
  backdrop-filter: blur(calc(var(--g-blur) * 1px)) saturate(1.2);
  -webkit-backdrop-filter: blur(calc(var(--g-blur) * 1px)) saturate(1.2);

  box-shadow: inset 0 1px 1px rgba(255,255,255,0.12), inset 0 -1px 1px rgba(255,255,255,0.04), 0 2px 12px rgba(0,0,0,0.15);
  position: relative;
  overflow: hidden;
}
.liquid-glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.2px;
  background: linear-gradient(170deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.15) 18%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 62%, rgba(255,255,255,0.12) 82%, rgba(255,255,255,0.4) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
}
.liquid-glass::after {
  content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.04) 0%, transparent 60%);

const { useState, useEffect, useRef, useCallback } = React;

/* ─── useInView ─── */
function useInView(opts = {}) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); if (opts.once !== false) obs.disconnect(); } }, { threshold: opts.threshold || 0.08 });
    obs.observe(el); return () => obs.disconnect();
  }, []);
  return [ref, vis];
}

/* ─── Anim wrapper ─── */
function Anim({ children, type = 'fade-up', delay = 0, className = '', style = {} }) {
  const [ref, vis] = useInView({ once: true });
  return <div ref={ref} className={`${vis ? `anim-${type}` : 'anim-hidden'} ${className}`} style={{ animationDelay: `${delay}s`, ...style }}>{children}</div>;
}

/* ─── GlassCard with mouse tracking ─── */
function GlassCard({ children, className = '', strong = false, onClick, style = {} }) {
  const ref = useRef(null);
  const onMove = useCallback((e) => {
    const r = ref.current?.getBoundingClientRect(); if (!r) return;
    const x = ((e.clientX - r.left) / r.width * 100); const y = ((e.clientY - r.top) / r.height * 100);
    ref.current.style.setProperty('--mx', x + '%'); ref.current.style.setProperty('--my', y + '%');
  }, []);
  return (
    <div ref={ref} onMouseMove={onMove} onClick={onClick}
      className={`glass-card ${strong ? 'liquid-glass-strong' : 'liquid-glass'} ${className}`} style={style}>
      <div className="mouse-glow" />
      {children}
    </div>
  );
}

/* ─── FadingVideo ─── */
function FadingVideo({ src, className, style }) {
  const vRef = useRef(null), rafRef = useRef(null), foRef = useRef(false);
  const fadeTo = useCallback((t, dur) => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const v = vRef.current; if (!v) return;
    const s = parseFloat(v.style.opacity) || 0, st = performance.now();
    const step = (now) => { const p = Math.min((now - st) / dur, 1); v.style.opacity = s + (t - s) * p; if (p < 1) rafRef.current = requestAnimationFrame(step); };
    rafRef.current = requestAnimationFrame(step);
  }, []);
  useEffect(() => {
    const v = vRef.current; if (!v) return;
    const onL = () => { v.style.opacity = '0'; v.play(); fadeTo(1, 500); };
    const onT = () => { if (!foRef.current && v.duration - v.currentTime <= 0.55 && v.duration - v.currentTime > 0) { foRef.current = true; fadeTo(0, 500); } };
    const onE = () => { v.style.opacity = '0'; setTimeout(() => { v.currentTime = 0; v.play(); foRef.current = false; fadeTo(1, 500); }, 100); };
    v.addEventListener('loadeddata', onL); v.addEventListener('timeupdate', onT); v.addEventListener('ended', onE);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); v.removeEventListener('loadeddata', onL); v.removeEventListener('timeupdate', onT); v.removeEventListener('ended', onE); };
  }, [fadeTo]);
  return <video ref={vRef} src={src} autoPlay muted playsInline preload="auto" className={className} style={{ opacity: 0, ...style }} />;
}

/* ─── BlurText ─── */
function BlurText({ text, className, baseDelay = 0 }) {
  const [ref, vis] = useInView({ once: true });

      ))}
    </p>

}

/* ─── Novel Reader ─── */
function NovelReader({ chapterId, onBack, onChapterChange }) {

  const part = PARTS.find(p => p.id === ch.part) || PARTS[0];
  const paragraphs = CHAPTER_CONTENT[chapterId] || [];
  const prompt = CHAPTER_PROMPTS[chapterId] || '';

  return (
    <section className="relative" style={{ height: '100vh', overflow: 'hidden' }}>
      {/* Gradient fallback behind video */}

      <FadingVideo src="./assets/videos/daniya_bg.mp4"
        className="absolute inset-0 w-full h-full object-cover z-0" style={{}} />
      <div className="absolute inset-0 bg-black/50 z-[1]" />

      {/* 3-column layout */}
      <div className="relative z-10 flex justify-center"
           style={{ height: '100vh', paddingTop: '5.5rem', paddingBottom: '1.5rem', paddingLeft: '2.5rem', paddingRight: '2.5rem', gap: '24px' }}>

        {/* ── Left sidebar ── */}

          {PARTS.map(p => {
            const pChapters = CHAPTERS.filter(c => c.part === p.id);
            return (
              <div key={p.id} className="mb-3">
                <div className="text-xs text-white/30 font-body tracking-wide px-3 py-1.5 mb-1">
                  {p.title}{p.subtitle ? ` · ${p.subtitle}` : ''}

                    className={`text-left w-full px-3 py-2 rounded-[0.65rem] text-[13px] font-body mb-0.5 border-none cursor-pointer transition-all leading-snug ${
                      c.id === chapterId ? 'bg-white/15 text-white shadow-sm' : 'bg-transparent text-white/40 hover:text-white/80 hover:bg-white/5'}`}>
                    {c.title}
                  </button>

          <div className="mt-auto pt-5">
            <button onClick={onBack}

               borderRadius: '32px',
               animation: 'fadeInUp 0.6s ease-out 0.1s forwards',
               opacity: 0,
               overflow: 'hidden',

               style={{ padding: '48px 56px 0 56px' }}>
            <div style={{ maxWidth: '860px', margin: '0 auto' }}>
              <span className="text-xs text-white/30 font-body tracking-widest uppercase">
                {part.title}{part.subtitle ? ` · ${part.subtitle}` : ''}
              </span>
              <h2 className="font-heading italic text-white text-4xl md:text-5xl tracking-[-2px] leading-tight mt-3 mb-10">{ch.title}</h2>

              {paragraphs.map((p, i) =>
                p === '' ? (
                  <div key={i} style={{ height: '20px' }} />
                ) : (
                  <p key={i} className="text-white/85 font-body font-light"

                       fontSize: '16.5px',

                       marginBottom: '14px',

                  <p className="text-white/50 font-heading italic text-lg leading-relaxed">"{prompt}"</p>
                </div>

          {/* Bottom nav */}
          <div className="flex-shrink-0" style={{ borderTop: '1px solid rgba(255,255,255,0.07)', padding: '16px 56px' }}>
            <div style={{ maxWidth: '860px', margin: '0 auto' }} className="flex items-center justify-between">
              <button onClick={() => chapterId > 0 && onChapterChange(chapterId - 1)} disabled={chapterId <= 0}

                <ChevronLeft /> 上一章

              <span className="text-xs text-white/30 font-body">{chapterId + 1} / {CHAPTERS.length}</span>
              <button onClick={() => chapterId < CHAPTERS.length - 1 && onChapterChange(chapterId + 1)} disabled={chapterId >= CHAPTERS.length - 1}

                下一章 <ChevronRight />

          </div>
        </div>

        {/* ── Right info panel ── */}
        <div className="hidden xl:flex flex-col gap-5 flex-shrink-0 overflow-y-auto reader-panel"
             style={{ width: '230px', animation: 'fadeInRight 0.5s ease-out 0.2s forwards', opacity: 0 }}>
          <div className="liquid-glass rounded-[1.25rem] p-5">
            <h4 className="font-heading italic text-white text-lg mb-4">当前篇章</h4>
            <div className="space-y-3">
              <div className="text-sm text-white/55 font-body"><span className="text-white/90 font-medium">{part.title}</span>{part.subtitle ? ` · ${part.subtitle}` : ''}</div>
              <div className="text-xs text-white/35 font-body">{part.desc}</div>

          <div className="liquid-glass rounded-[1.25rem] p-5">

          </div>
          <div className="liquid-glass rounded-[1.25rem] p-5">
            <h4 className="font-heading italic text-white text-lg mb-4">进度</h4>
            <div className="w-full bg-white/8 rounded-full h-2 mb-2.5 overflow-hidden">
              <div className="h-2 rounded-full transition-all" style={{ width: `${((chapterId + 1) / CHAPTERS.length) * 100}%`, background: 'linear-gradient(90deg, rgba(255,255,255,0.35), rgba(255,255,255,0.55))' }} />

      {/* Mobile bottom bar */}
      <div className="lg:hidden fixed bottom-0 left-0 right-0 z-50 liquid-glass p-4 flex items-center justify-between">
        <button onClick={() => chapterId > 0 && onChapterChange(chapterId - 1)}
          className="w-11 h-11 rounded-full liquid-glass flex items-center justify-center text-white border-none cursor-pointer bg-transparent"><ChevronLeft /></button>
        <span className="text-sm text-white/50 font-body">{ch.title}</span>
        <button onClick={() => chapterId < CHAPTERS.length - 1 && onChapterChange(chapterId + 1)}
          className="w-11 h-11 rounded-full liquid-glass flex items-center justify-center text-white border-none cursor-pointer bg-transparent"><ChevronRight /></button>
      </div>
    </section>
  );
}

/* ─── Memory Gallery ─── */

    <section id="memories" className="relative py-28 px-10 md:px-16 lg:px-24">
      <div className="absolute inset-0 bg-gradient-to-b from-[#0a0a14] via-[#0c0a18]/95 to-[#0a0a14] z-0" />
      <div className="relative z-10 max-w-7xl mx-auto">
        <Anim><p className="text-sm font-body text-white/45 mb-5 tracking-wider">// 回忆碎片</p></Anim>
        <Anim delay={0.1}>
          <h2 className="font-heading italic text-white text-5xl md:text-6xl lg:text-7xl leading-[0.88] tracking-[-3px] mb-14">

          {MEMORIES.map((mem, i) => (
            <Anim key={i} delay={0.2 + i * 0.08}>
              <GlassCard className="rounded-[1.25rem] p-7 cursor-default min-h-[200px]">
                <div className="flex items-center justify-between mb-5">
                  <span className="tag-pill">{mem.type}</span>
                  <span className="text-white/20"><Sparkles s={20} /></span>

                <h3 className="font-heading italic text-white text-3xl mb-3 tracking-[-0.5px]">{mem.title}</h3>

/* ─── Footer ─── */
function Footer() {
  return (
    <footer className="relative py-20 px-8 flex flex-col items-center">
      <div className="absolute inset-0 bg-[#0a0a14] z-0" />
      <div className="relative z-10 flex flex-col items-center gap-5">
        <h3 className="font-heading italic text-white/40 text-3xl">Daniya Story Archive</h3>
        <p className="text-sm text-white/20 font-body font-light">Made for a quiet summer memory</p>
        <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
          className="liquid-glass rounded-full w-11 h-11 flex items-center justify-center text-white/35 bg-transparent border-none cursor-pointer hover:text-white/70 transition-colors mt-6">
          <ChevronUp />
        </button>
      </div>

/* ─── Glass Transparency Control ─── */
function GlassControl() {
  const [open, setOpen] = useState(false);
  const [blur, setBlur] = useState(50);
  const [alpha, setAlpha] = useState(50);

  useEffect(() => {
    const root = document.documentElement.style;
    const lightBlur = Math.round(blur * 0.6);
    const strongBlur = Math.round(20 + blur * 0.8);
    const lightAlpha = (alpha / 100 * 0.1).toFixed(4);
    const strongAlpha = (alpha / 100 * 0.2).toFixed(4);
    root.setProperty('--g-blur', lightBlur);
    root.setProperty('--g-blur-s', strongBlur);
    root.setProperty('--g-alpha', lightAlpha);
    root.setProperty('--g-alpha-s', strongAlpha);
  }, [blur, alpha]);

  const handleReset = () => { setBlur(50); setAlpha(50); };

  return (
    <div className="fixed bottom-6 right-6 z-[60]" style={{ pointerEvents: 'auto' }}>
      {open && (
        <div className="liquid-glass-strong rounded-[1.25rem] p-5 mb-3"
             style={{ width: '250px', animation: 'fadeInUp 0.25s ease-out forwards' }}>
          <div className="flex items-center justify-between mb-5">
            <span className="text-sm font-body text-white/70 font-medium">玻璃设置</span>
            <div className="flex items-center gap-2">
              <button onClick={handleReset}
                className="w-7 h-7 rounded-full flex items-center justify-center text-white/30 hover:text-white/70 bg-white/5 hover:bg-white/10 border-none cursor-pointer transition-colors">
                <ResetIcon s={12} />
              </button>
              <button onClick={() => setOpen(false)}
                className="w-7 h-7 rounded-full flex items-center justify-center text-white/30 hover:text-white/70 bg-white/5 hover:bg-white/10 border-none cursor-pointer transition-colors text-xs font-body">
                ✕
              </button>
            </div>
          </div>
          <div className="mb-5">
            <div className="flex items-center justify-between mb-2.5">
              <label className="text-xs text-white/40 font-body">模糊度</label>
              <span className="text-xs text-white/25 font-body">{blur}%</span>
            </div>
            <input type="range" min="0" max="100" value={blur}
              onChange={e => setBlur(+e.target.value)} className="glass-slider" />
          </div>
          <div>
            <div className="flex items-center justify-between mb-2.5">
              <label className="text-xs text-white/40 font-body">透明度</label>
              <span className="text-xs text-white/25 font-body">{alpha}%</span>
            </div>
            <input type="range" min="0" max="100" value={alpha}
              onChange={e => setAlpha(+e.target.value)} className="glass-slider" />
          </div>
        </div>
      )}
      <button onClick={() => setOpen(!open)}
        className={`w-12 h-12 rounded-full flex items-center justify-center border-none cursor-pointer transition-all ${
          open ? 'liquid-glass-strong text-white/90 scale-95' : 'liquid-glass text-white/50 hover:text-white/80 hover:scale-105'}`}>
        <GearIcon s={20} />
      </button>
    </div>
  );
}

/* ─── App ─── */
function App() {
  const [view, setView] = useState('home');
  const [activeChapter, setActiveChapter] = useState(0);

  useEffect(() => {
    const el = document.getElementById('loading-screen');
    if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 600); }
  }, []);

  const handleNavigate = (target) => {
    if (['home','story','chapters','memories'].includes(target)) {
      if (view !== 'home') setView('home');
      setTimeout(() => { document.getElementById(target === 'home' ? 'hero' : target)?.scrollIntoView({ behavior: 'smooth' }); }, view !== 'home' ? 100 : 0);
    } else if (target === 'reader') { setView('reader'); window.scrollTo({ top: 0 }); }
  };
  const handleSelectChapter = (id) => { setActiveChapter(id); setView('reader'); window.scrollTo({ top: 0 }); };
  const handleSelectPart = (partId) => {
    const firstCh = CHAPTERS.find(c => c.part === partId);
    if (firstCh) { setActiveChapter(firstCh.id); setView('reader'); window.scrollTo({ top: 0 }); }
  };

  return (
    <React.Fragment>
      <Navbar onNavigate={handleNavigate} />
      <GlassControl />
      {view === 'home' ? (
        <div key="home">
          <HeroSection onNavigate={handleNavigate} />
          <StoryOverview onSelectPart={handleSelectPart} />
          <ChapterSelection onSelectChapter={handleSelectChapter} />
          <MemoryGallery />
          <Footer />
        </div>
      ) : (
        <div key="reader">
          <NovelReader chapterId={activeChapter} onBack={() => handleNavigate('chapters')}
            onChapterChange={(id) => { setActiveChapter(id); window.scrollTo({ top: 0 }); }} />
        </div>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
