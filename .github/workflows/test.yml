name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Check sensitive tracked files
        run: python tools/check_sensitive_files.py

      - name: Check character packs
        run: python tools/check_character_packs.py

      - name: Check config templates
        run: python tools/check_config_templates.py

      - name: Check docs links
        run: python tools/check_docs_links.py
