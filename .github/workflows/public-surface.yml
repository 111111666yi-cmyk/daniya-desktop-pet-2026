name: Public Surface Audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Audit public repo surface
        run: python tools/audit_repo_surface.py
