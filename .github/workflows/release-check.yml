name: Release Check

on:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build release package
        run: cmd /c pack.bat

      - name: Scan release zip
        id: zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath release -Filter *.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { throw "No release zip found." }
          python tools/check_release_zip.py $zip.FullName
          "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload scanned release zip
        uses: actions/upload-artifact@v4
        with:
          name: daniya-release-zip
          path: ${{ steps.zip.outputs.zip_path }}
